name: Catalog registry

# The catalog registry document — `.compose-preview/catalogs.json` — is what a preview server fetches
# when it nominates `yschimke/compose-preview-imports-out` with `--catalog-registry`. It lives on that
# OUTPUT repository's `main`, beside the `design-artifacts/<slug>` branches it names, because a
# server serves a registry's entries only from the registry's own branches. It is DERIVED from this
# repository's `imports/` directory, and the two jobs here are split so that deriving it never lands
# in a pull request:
#
#   lint (pull requests) — checks the import descriptions themselves. An import's pull request adds
#     imports/<slug>/import.json and catalog.spec.json (plus patches/*.patch, when the import carries
#     an upstream refactor) and nothing else.
#
#   sync (push to main)  — regenerates the document and, when it changed, pushes it to the output
#     repository's `main`. This is why an import's pull request touches only its own files: the
#     shared, generated one is written here, after the merge, instead of by every open pull request
#     racing to append the same line.
#
#     It used to be committed to THIS repository, which meant a pull request per regeneration
#     (`main` here carries a ruleset — changes must arrive through a pull request) and an import that
#     was not served until that second pull request landed. The output repository holds nothing but
#     machine-written output, so the job pushes to it directly: merging the import's pull request is
#     the whole import again.
#
# The job that writes runs no third-party code — it runs `jq` over files already merged into this
# repository — so the boundary docs/SECURITY.md draws is unaffected: nothing an imported project
# controls executes in a job holding a writable credential. ARTIFACTS_TOKEN is the same secret
# import.yml's publish job uses, scoped to the output repository alone.

on:
  pull_request:
    paths:
      - 'imports/**'
      - 'scripts/sync-catalog-registry.sh'
      - '.github/workflows/catalog-registry.yml'
  push:
    branches: [main]
    paths:
      - 'imports/**'
      - 'scripts/sync-catalog-registry.sh'
      - '.github/workflows/catalog-registry.yml'
  # Re-derive by hand — after rotating ARTIFACTS_TOKEN, say, or if a sync run failed.
  workflow_dispatch:

permissions: {}

concurrency:
  # Serialised: two imports merging within a minute of each other must not race to push the same
  # regenerated document.
  group: catalog-registry
  cancel-in-progress: false

env:
  ARTIFACT_REPOSITORY: yschimke/compose-preview-imports-out
  DOCUMENT: .compose-preview/catalogs.json

jobs:
  lint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The import descriptions are well-formed
        run: ./scripts/sync-catalog-registry.sh --lint

      - name: The registry document generates
        run: ./scripts/sync-catalog-registry.sh --print | jq -e '(.catalogs | type) == "array" and (.groups | type) == "array"' >/dev/null

  sync:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Nothing in this repository is written; the push goes to the output repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check out the output repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ARTIFACT_REPOSITORY }}
          ref: main
          path: out
          persist-credentials: false

      - name: Regenerate the published registry document
        id: sync
        run: |
          set -euo pipefail
          ./scripts/sync-catalog-registry.sh "out/${DOCUMENT}"
          if git -C out diff --quiet -- "${DOCUMENT}" \
            && [ -z "$(git -C out status --porcelain -- "${DOCUMENT}")" ]; then
            echo "::notice::${ARTIFACT_REPOSITORY}:${DOCUMENT} already agrees with the imports/ directory"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push it to ${{ env.ARTIFACT_REPOSITORY }}
        if: ${{ steps.sync.outputs.changed == 'true' }}
        env:
          ARTIFACT_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$ARTIFACT_TOKEN" ] || {
            echo "::error::ARTIFACTS_TOKEN is not set. It must be a fine-grained PAT with Contents:" \
              "Read and write on ${ARTIFACT_REPOSITORY}, stored as a repository secret here."
            exit 1
          }
          cd out
          git config user.name "compose-preview-imports"
          git config user.email "noreply@schimke.ee"
          git add -- "${DOCUMENT}"
          git commit -m "chore: regenerate the catalog registry document" \
            -m "Generated from the imports/ directory of ${GITHUB_REPOSITORY}@${GITHUB_SHA} by scripts/sync-catalog-registry.sh."
          # The credential goes on this one command line rather than into the checkout, so nothing
          # else in the job inherits a writable remote. A plain push, not a force: a concurrent edit
          # to the output repository's `main` fails this run visibly instead of being overwritten,
          # and the concurrency group above already serialises this workflow against itself.
          git push "https://x-access-token:${ARTIFACT_TOKEN}@github.com/${ARTIFACT_REPOSITORY}.git" HEAD:refs/heads/main
          echo "::notice::pushed ${DOCUMENT} to ${ARTIFACT_REPOSITORY}"
