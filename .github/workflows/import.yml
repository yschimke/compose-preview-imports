name: Import a project

# Builds ONE imported project and publishes it to design-artifacts/<slug>.
#
# The security shape is the point of this file, so it is stated here rather than left to be
# inferred from the job graph:
#
#   build    — checks out a THIRD-PARTY repository and runs its Gradle build.
#              `permissions: contents: read`: a READ-ONLY token, and nothing else. The foreign build
#              cannot push a branch, force-push a delivery ref, open a pull request, or write a
#              release, because the token in its environment carries no write scope at all. Its only
#              output is an uploaded artifact.
#
#              `contents: write` here is a CEILING, not what the build gets, and the distinction is
#              the whole reason this is safe. A calling job must declare at least the maximum any
#              job in the called workflow asks for — the pipeline's `publish-catalog` job asks for
#              write, so anything less fails the run before a single job starts, whatever
#              `publish: false` says (permissions are static; the input only skips the job).
#
#              Each called job then runs with ITS OWN declared permissions, capped by that ceiling.
#              So the job that actually renders the imported project (`generate`) holds
#              `contents: read` and nothing more, and the write scope exists only in
#              `publish-catalog`, which runs none of the imported code. Verified by running it:
#              `contents: read` here fails at startup, `contents: write` starts and the render
#              proceeds under read.
#
#              This job runs nothing itself — it is a `uses:` shim — so the ceiling it declares is
#              never a process the imported build is inside of.
#
#   publish  — downloads that artifact and force-pushes it to design-artifacts/<slug>.
#              `permissions: contents: write`, and it runs NO third-party code.
#
# Splitting them is what makes the WRITE token safe. GITHUB_TOKEN is already minted per-run and
# scoped to THIS repository — it cannot touch another repo, and it expires when the job ends — but a
# token scoped to this repo is still a token an untrusted build could use to push a branch here.
# Keeping the two in separate jobs means the credential and the foreign code are never in the same
# process, so the blast radius of a malicious import is "the run produces a bad artifact", which the
# publish job's own inputs bound, rather than "the run writes to this repository".
#
# No personal access token is involved anywhere. A PRIVATE upstream would need one — a fine-grained
# PAT with Contents: Read on the named repositories only, passed to the upstream checkout step's
# `token:` input and nowhere else — but every import here is public, so the checkout needs no
# credential.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Import slug to build (the name after import/ on its branch).'
        required: true
        type: string
      publish:
        description: 'Force-push the result to design-artifacts/<slug>. Off = build only, for trying an import out.'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: true

# Default to nothing. Each job opts into exactly what it needs, below.
permissions: {}

concurrency:
  # One run per import. A refresh sweep and a manual re-run of the same project queue rather than
  # racing each other to force-push the same delivery branch.
  group: import-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  # Read the import's description off its own branch. Split out so the build job's inputs are
  # ordinary strings a human can read in the run log, rather than a JSON blob parsed mid-build.
  config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upstream: ${{ steps.read.outputs.upstream }}
      ref: ${{ steps.read.outputs.ref }}
      modules: ${{ steps.read.outputs.modules }}
      renderer: ${{ steps.read.outputs.renderer }}
      javaVersion: ${{ steps.read.outputs.javaVersion }}
      previewAnnotations: ${{ steps.read.outputs.previewAnnotations }}
      workingDirectory: ${{ steps.read.outputs.workingDirectory }}
      excludePreviewIds: ${{ steps.read.outputs.excludePreviewIds }}
      stubGoogleServices: ${{ steps.read.outputs.stubGoogleServices }}
      variant: ${{ steps.read.outputs.variant }}
      renderTimeout: ${{ steps.read.outputs.renderTimeout }}
    steps:
      - name: Check out the import branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: import/${{ inputs.slug }}
          persist-credentials: false

      - name: Read import.json
        id: read
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          config="imports/${SLUG}/import.json"
          test -f "$config" || { echo "::error::import/${SLUG} has no ${config}"; exit 1; }

          slug=$(jq -r '.slug' "$config")
          upstream=$(jq -r '.upstream' "$config")
          ref=$(jq -r '.ref // "main"' "$config")
          # The pipeline renders ONE module, or every previewable module when told `all`. A list of
          # two would have been joined into a single bogus Gradle path, so it is refused here with
          # the two things the author can actually do about it.
          module_count=$(jq -r '(.modules // []) | length' "$config")
          case "$module_count" in
            0) modules="" ;;
            1) modules=$(jq -r '.modules[0]' "$config") ;;
            *)
              echo "::error::import.json names ${module_count} modules; the pipeline renders one." \
                "Either drop \"modules\" to publish every previewable module, or split this into" \
                "one import per module."
              exit 1
              ;;
          esac

          # Which render lane. An ANDROID @Preview (androidx.compose.ui.tooling.preview.Preview)
          # renders under Robolectric; a Compose Multiplatform @Preview in a commonMain source set
          # (org.jetbrains.compose.ui.tooling.preview.Preview) has no Android context to render in
          # and goes through the desktop/Skiko lane instead. Which one a module needs is a property
          # of the upstream project, not a preference, so it is recorded per import rather than
          # guessed: BikeShare's :common and ClimateTraceKMP's :composeApp are commonMain CMP,
          # PeopleInSpace's :app and GalwayBus's :androidApp are Android.
          renderer=$(jq -r '.renderer // "android"' "$config")
          case "$renderer" in
            android|desktop) ;;
            *)
              echo "::error::renderer '${renderer}' is not one of: android, desktop"
              exit 1
              ;;
          esac

          # An imported project picks its own Gradle toolchain and we do not get to choose it:
          # ClimateTraceKMP's :composeApp asks for Java 24, which the runner does not carry, and the
          # build died before resolving a dependency. Naming the major version here has the pipeline
          # install that JDK alongside the 21 the CLI runs on. Empty is the normal case.
          java_version=$(jq -r '.javaVersion // ""' "$config")
          echo "$java_version" | grep -Eq '^([0-9]{1,2})?$' || {
            echo "::error::javaVersion '${java_version}' is not a major version like 21 or 24"
            exit 1
          }

          # Multipreview annotations the spec pre-flight cannot see for itself.
          #
          # The pre-flight is a SOURCE scan: it reads the upstream's .kt files and matches @Preview
          # by name. A preview annotated only with a multipreview declared in another module —
          # @WearPreviewDevices, @WearPreviewFontScales — is invisible to it, and every spec entry
          # naming such a preview fails with "matches no @Preview function in the scanned module".
          # The reusable workflow's own input documentation is blunt about it: "Wear catalogs always
          # need this." joreilly/Confetti's :wearApp is the case that proved it here.
          preview_annotations=$(jq -r '.previewAnnotations // ""' "$config")
          # Whitespace-separated simple annotation names. Validated because the value reaches a
          # workflow input, and a stray character here fails the pre-flight rather than the parse.
          echo "$preview_annotations" | grep -Eq '^([A-Za-z_][A-Za-z0-9_]*( +[A-Za-z_][A-Za-z0-9_]*)*)?$' || {
            echo "::error::previewAnnotations '${preview_annotations}' is not a space-separated list of annotation names"
            exit 1
          }

          # Where the upstream's Gradle build actually is. Most projects put it at the repository
          # root, which is what the pipeline assumes; some do not — mullvadvpn-app is one Rust
          # repository whose Android client is an entire Gradle build under `android/`, with no
          # settings.gradle.kts at the root at all, so a render from the root finds nothing to
          # build. The reusable workflow already understands this (`working-directory`, applied
          # INSIDE the upstream checkout in import mode); it just had no way to be told from here.
          working_directory=$(jq -r '.workingDirectory // ""' "$config")
          # A repo-relative subdirectory and nothing else: it is joined onto the checkout path, so
          # an absolute path or a `..` segment would name a directory outside the upstream tree.
          echo "$working_directory" | grep -Eq '^([A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)?$' || {
            echo "::error::workingDirectory '${working_directory}' is not a relative path inside the upstream checkout"
            exit 1
          }
          case "/${working_directory}/" in
            */../*)
              echo "::error::workingDirectory '${working_directory}' must not contain a '..' segment"
              exit 1
              ;;
          esac

          # Previews this import cannot render, named individually.
          #
          # A preview that reads a CompositionLocal its host application installs, resolves a Hilt
          # entry point, or touches a process-wide singleton renders fine in the app and not at all
          # standalone. There is nothing to fix upstream and nothing to fix here — it is simply not
          # a preview an import can produce. Without a way to say so, ONE of them fails the whole
          # run: bitwarden rendered 55 of 56 and published nothing, pocketcasts-wear 24 of 28,
          # twine 21 of 22.
          #
          # Named ids rather than `allow-incomplete`, deliberately. Allowing incomplete renders
          # would also swallow the next real breakage — an upstream refactor that quietly stops
          # rendering half the catalog — and the import would go on publishing a thinner catalog
          # every night without anyone noticing. Listing the ids keeps every OTHER render failure
          # fatal, and the list itself is reviewable: a reader of the pull request sees exactly what
          # this import gives up, and why, in `notes`.
          exclude_preview_ids=$(jq -r '.excludePreviewIds // [] | join(",")' "$config")
          # Comma-separated preview-id glob patterns. The value is appended to the reusable
          # workflow's own always-on patterns and split on commas there, so a comma inside an entry
          # or a stray space would silently become a different pattern than the author wrote.
          #
          # `grep -z`, not plain `grep`, and that is not a flourish. `grep -Eq '^…$'` anchors PER
          # LINE, so a value containing a newline passes as long as each line matches on its own —
          # and this value is then written to $GITHUB_OUTPUT as `excludePreviewIds=<value>`, where
          # an embedded newline starts a second key=value the reader never wrote. -z makes the whole
          # NUL-terminated value one record, so ^ and $ mean the ends of the VALUE. The empty case
          # is handled before it because -z sees no record at all in empty input and would reject
          # the field simply being absent, which is every import that has not needed this.
          [ -z "$exclude_preview_ids" ] || \
            printf '%s' "$exclude_preview_ids" |
              grep -zEq '^[A-Za-z0-9_.$*?-]+(,[A-Za-z0-9_.$*?-]+)*$' || {
            echo "::error::excludePreviewIds '${exclude_preview_ids}' must be preview-id patterns" \
              "(letters, digits, . _ - \$ and the * ? globs), one per array entry, no spaces"
            exit 1
          }

          # Android applicationIds to write a stub google-services.json for.
          #
          # An upstream that applies the Google Services plugin but does not commit the file cannot
          # CONFIGURE without one. home-assistant/android is the case: its convention plugin applies
          # the plugin to every application module and contributors bring their own file, so :app
          # dies on `processMinimalDebugGoogleServices` before a preview is discovered.
          #
          # These must be the EXACT applicationId of the variant being rendered, suffixes included.
          # Verified against a real AGP build rather than assumed: a stub naming only the base
          # package fails with "No matching client found for package name", so there is no prefix
          # fallback, and nothing in the pipeline can guess a flavour suffix a convention plugin in
          # another repository decided on. Naming them here makes the stub the import's declared
          # statement rather than a guess, and a reviewer can check them against the upstream build.
          stub_google_services=$(jq -r '.stubGoogleServices // [] | join(",")' "$config")
          # Package names and commas, nothing else. `grep -z` for the same reason as above: the
          # value reaches $GITHUB_OUTPUT, and a plain anchored grep matches per LINE, so an embedded
          # newline would pass and start a second key=value nobody wrote.
          [ -z "$stub_google_services" ] || \
            printf '%s' "$stub_google_services" |
              grep -zEq '^[A-Za-z0-9_.]+(,[A-Za-z0-9_.]+)*$' || {
            echo "::error::stubGoogleServices '${stub_google_services}' must be Android" \
              "applicationIds (letters, digits, . and _), one per array entry, no spaces"
            exit 1
          }

          # The Android variant the preview plugin attaches its tasks to.
          #
          # The plugin's convention is `debug`, which is right for any module without product
          # flavors — and wrong for one with them, because there is then no plain `debug` and the
          # flavor picked for you may not be the one that builds. home-assistant/android's :app is
          # the case: `app/src/screenshotTest/` is flavor-agnostic but references a symbol declared
          # only in `app/src/full/`, so `minimalDebug` fails to compile the screenshot-test sources
          # the plugin renders previews from, before a preview exists.
          variant=$(jq -r '.variant // ""' "$config")
          # A Gradle variant name: letters and digits, and that is the whole grammar AGP allows for
          # a flavor or build type. `grep -z` for the same reason as the fields above — the value
          # reaches $GITHUB_OUTPUT.
          [ -z "$variant" ] || \
            printf '%s' "$variant" | grep -zEq '^[A-Za-z][A-Za-z0-9]*$' || {
            echo "::error::variant '${variant}' must be a Gradle variant name" \
              "(letters and digits, e.g. fullDebug)"
            exit 1
          }

          # Seconds the render may spend, when the default 600 is not enough.
          #
          # This is the INNER timeout on `bundle pack`, not the job timeout: a render can sit well
          # inside the job budget and still be killed here, and the failure reads as a bare
          # "Build timed out after 600s" with nothing else wrong. It scales with the preview count,
          # so a large catalog outgrows the default long before it outgrows the job — pocketcasts'
          # :modules:services:compose was still making progress at 600s.
          render_timeout=$(jq -r '.renderTimeout // ""' "$config")
          # Digits only, and bounded: the reusable workflow's own job timeout is the real ceiling,
          # so a value above it would just move where the run dies.
          [ -z "$render_timeout" ] || \
            printf '%s' "$render_timeout" | grep -zEq '^[1-9][0-9]{2,4}$' || {
            echo "::error::renderTimeout '${render_timeout}' must be a whole number of seconds" \
              "between 100 and 99999"
            exit 1
          }

          # The slug names the delivery branch and the route the server serves this at, so a branch
          # whose import.json disagrees with its own name would publish to somewhere nobody is
          # looking. Caught here rather than three jobs later.
          [ "$slug" = "$SLUG" ] || {
            echo "::error::${config} says slug=${slug} but the branch is import/${SLUG}"
            exit 1
          }
          # `upstream` reaches a checkout and `ref` reaches a git command line. Both are reviewed in
          # the import's pull request, and both are validated anyway — review is a control, not a
          # parser.
          echo "$upstream" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$' || {
            echo "::error::upstream '${upstream}' is not an owner/repo"; exit 1; }
          echo "$ref" | grep -Eq '^[A-Za-z0-9._/-]+$' || {
            echo "::error::ref '${ref}' is not a usable git ref"; exit 1; }

          {
            echo "upstream=${upstream}"
            echo "ref=${ref}"
            echo "modules=${modules}"
            echo "renderer=${renderer}"
            echo "javaVersion=${java_version}"
            echo "previewAnnotations=${preview_annotations}"
            echo "workingDirectory=${working_directory}"
            echo "excludePreviewIds=${exclude_preview_ids}"
            echo "stubGoogleServices=${stub_google_services}"
            echo "variant=${variant}"
            echo "renderTimeout=${render_timeout}"
          } >> "$GITHUB_OUTPUT"

  # Calls the pipeline that builds the imported project. See the header: this declares the ceiling
  # the called workflow needs, NOT the scope its render runs under — that job declares read itself.
  build:
    needs: config
    permissions:
      contents: write
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@main
    with:
      system: ${{ inputs.slug }}
      # The spec describing an imported project lives in THIS repository, on the import's branch —
      # it is our description of their code, and it is not their business to carry it.
      spec: imports/${{ inputs.slug }}/catalog.spec.json
      ref: import/${{ inputs.slug }}
      upstream-repository: ${{ needs.config.outputs.upstream }}
      upstream-ref: ${{ needs.config.outputs.ref }}
      # An upstream whose Gradle build is not at its repository root says so, and the render happens
      # in that subdirectory of the checkout instead. `spec` is unaffected — it is read from THIS
      # repository, and stays repo-root-relative.
      working-directory: ${{ needs.config.outputs.workingDirectory }}
      # Exactly one of these carries: `modules: all` sweeps every previewable module, `module`
      # names one. The config job guarantees they are mutually exclusive.
      modules: ${{ needs.config.outputs.modules == '' && 'all' || '' }}
      module: ${{ needs.config.outputs.modules }}
      # Hand the render off instead of pushing it: publishing is the next job's business, and this
      # one must not hold a token that could.
      # A commonMain CMP preview cannot render under Robolectric, so the lane is the import's to
      # declare. The reusable workflow installs Mesa software GL + fonts and runs the render under
      # xvfb when this is true; ubuntu-latest already carries the Android SDK for the false case.
      desktop-render: ${{ needs.config.outputs.renderer == 'desktop' }}
      # A third-party build's toolchain is its own business, so when it needs a JDK the runner does
      # not carry, the import says so and the pipeline installs it alongside JDK 21. Empty ⇒ 21
      # alone, which is every import that has not needed otherwise.
      upstream-java-version: ${{ needs.config.outputs.javaVersion }}
      # Teaches the build-free spec pre-flight about multipreviews declared in another module. See
      # the config job: without it a Wear catalog's spec entries all fail as "matches no @Preview".
      preview-annotations: ${{ needs.config.outputs.previewAnnotations }}
      # The previews this import has declared it cannot render — see the config job. Appended to the
      # pipeline's own always-on exclusions rather than replacing them, so naming one here does not
      # quietly re-enable the synthetic app-launching previews.
      exclude-preview-ids: ${{ needs.config.outputs.excludePreviewIds }}
      # The applicationIds this import needs a placeholder google-services.json for — see the config
      # job. Empty for every import whose upstream does not apply the Google Services plugin, which
      # is all of them but home-assistant.
      stub-google-services-packages: ${{ needs.config.outputs.stubGoogleServices }}
      # The Android variant to render — see the config job. Empty for every module without product
      # flavors, which is all of them but home-assistant/android's :app.
      variant: ${{ needs.config.outputs.variant }}
      # Seconds the render may spend — see the config job. `fromJSON` because the reusable
      # workflow's input is typed `number` and a job output is always a string; the literal 600
      # repeats that input's own default, so an import that says nothing is unchanged.
      render-timeout: ${{ needs.config.outputs.renderTimeout != '' && fromJSON(needs.config.outputs.renderTimeout) || 600 }}
      # Carry the EXECUTABLE render bundle onto the delivery branch, not just baked PNGs, so a
      # serve box that bakes the matching daemon re-renders these previews live — device, theme and
      # knob controls work instead of replaying a snapshot.
      #
      # This is the escalation preview.coo.ee's producers.json anticipated and asked to be revisited
      # rather than inherited silently: that box runs SERVE_ALLOW_RENDER_TRUSTED=1 and branch-trusts
      # this repository, so from here on an import's bundle is eligible for SERVER-SIDE EXECUTION
      # there. The boundary that made importing safe is unchanged — the build still runs under
      # `contents: read` in a job that cannot publish — but what the branch CARRIES is now third-party
      # code, and a box's trust in this repository is now trust in what it renders. A box that does
      # not want that either drops the branch trust or runs without --allow-render-trusted.
      #
      # embed-deps is deliberately left off: it is only needed when a module depends on artifacts the
      # serve box cannot resolve from Central (JitPack-only), and the failure is soft and visible —
      # the catalog reports livebundle-unavailable and falls back to baked PNGs. Turn it on per
      # import if one does, rather than inflating every bundle for a case none of them has hit.
      publish-live-bundle: true
      # Pure editable SVGs are a daemon data product: keep them transient through catalog
      # generation, then produce and cache them on request. Raster-backed hybrid SVGs stay static so
      # their crop references remain self-contained. Requires publish-live-bundle, which is on above.
      defer-figma-svg: true
      # No per-preview split, the same treatment wear-m3 and the consumer callers take. The split
      # writes one manifest and one set of stickers PER PREVIEW, and every catalog change rewrites
      # all of them onto an append-only delivery branch — carriage an import, refreshed nightly for
      # a project we do not control, would pay every night. The module bundle above is what a
      # trusted serve host hydrates, so the live re-render lane survives without it, and `split-mode`
      # is dropped with the split since that is the only thing it modifies.
      split-per-preview: false
      publish: false
      upload-out: true

  publish:
    needs: [config, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      # The only write in the whole workflow, in the only job that runs no third-party code.
      contents: write
    steps:
      # This repository is deliberately NOT checked out. Nothing in this job reads it — the content
      # to publish arrives as an artifact and the helper comes from compose-ai-tools — and a
      # checkout here puts a git repo with its own `origin` remote in the workspace, which the push
      # helper's `git remote add origin` then collides with. Same reasoning as compose-ai-tools'
      # publish-catalog job, which stopped checking the caller out for the same reason.
      - name: Fetch the push helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: main
          path: compose-ai-tools
          persist-credentials: false

      - name: Download the rendered catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.slug }}-catalog-out
          path: out

      - name: Force-push to design-artifacts/${{ inputs.slug }}
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
          UPSTREAM: ${{ needs.config.outputs.upstream }}
          UPSTREAM_REF: ${{ needs.config.outputs.ref }}
        run: |
          set -euo pipefail
          test -d out || { echo "::error::no out/ to publish"; exit 1; }

          # The helper runs `git init`, `git remote add origin` and `git add -A` in the CURRENT
          # directory, so the directory it starts in is exactly what gets force-pushed. It must be
          # the rendered catalog and nothing else — run from the workspace root it would stage the
          # whole checkout instead. compose-ai-tools' own publish step cds the same way.
          cd "$GITHUB_WORKSPACE/out"

          # The same helper, and the same delivery-branch contract, the first-party catalogs use —
          # so an imported catalog is an ordinary one to every reader downstream.
          TARGET_BRANCH="design-artifacts/${SLUG}" \
          REPO="$GITHUB_REPOSITORY" \
          GITHUB_TOKEN_INLINE="$GH_TOKEN" \
          MSG="chore(import): rebuild ${SLUG} from ${UPSTREAM}@${UPSTREAM_REF} ($(date -u +%F))" \
          SKIP_IF_UNCHANGED=1 \
          REVISION_PREVIEW_INDEX=1 \
          GIT_AUTHOR_NAME="compose-preview-imports" \
          GIT_AUTHOR_EMAIL="noreply@schimke.ee" \
          GIT_COMMITTER_NAME="compose-preview-imports" \
          GIT_COMMITTER_EMAIL="noreply@schimke.ee" \
            bash "$GITHUB_WORKSPACE/compose-ai-tools/.github/actions/apply/lib/push-branch.sh"

      - name: Summary
        env:
          SLUG: ${{ inputs.slug }}
          UPSTREAM: ${{ needs.config.outputs.upstream }}
          UPSTREAM_REF: ${{ needs.config.outputs.ref }}
        run: |
          {
            echo "### Imported \`${UPSTREAM}\`"
            echo
            echo "- built from \`${UPSTREAM}@${UPSTREAM_REF}\`"
            echo "- published to \`design-artifacts/${SLUG}\`"
            echo "- served at https://preview.coo.ee/${SLUG}/ once the box refreshes"
          } >> "$GITHUB_STEP_SUMMARY"
