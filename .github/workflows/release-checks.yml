name: Release configuration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata
        run: python3 scripts/check-release.py
      - name: Validate import descriptions without building imported code
        run: |
          ./scripts/sync-catalog-registry.sh --lint
          ./scripts/sync-catalog-registry.sh --print | jq -e '(.catalogs | type) == "array" and (.groups | type) == "array"' >/dev/null
